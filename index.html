<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BABIAK · Príbeh</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #141414; font: 17px/1.55 Jost, Futura, "Century Gothic", sans-serif; }
    .chapter { padding-block: clamp(3rem, 8vw, 8rem); }
    .content { width: min(1140px, calc(100% - 2 * clamp(20px, 4vw, 64px))); margin-inline: auto; }
    .intro { background: #F5F3EE; min-height: 42svh; }
    .story { background: #FFFFFF; min-height: 32svh; }
    .detail { background: #ECE9E2; min-height: 32svh; }
    .closing { background: #141414; color: #F5F3EE; min-height: 26svh; }
  </style>
</head>
<body>
  <main>
    <section id="uvod" class="chapter intro"><div class="content"></div></section>
    <section id="pribeh" class="chapter story"><div class="content"></div></section>
    <section id="detail" class="chapter detail"><div class="content"></div></section>
    <section id="zaver" class="chapter closing"><div class="content"></div></section>
  </main>
</body>
</html>
