<body>
  <main>
    <section id="uvod" class="chapter intro"><div class="content">
      <h1>S AI pribúdajú nápady. Kto ich dotiahne?</h1>
      <p>Na poradu dnes môže každý priniesť päť návrhov kampane. Stále však treba jeden vybrať, spustiť ho a zistiť, či priviedol zákazníkov.</p>
      <div class="switch" role="group" aria-label="Porovnať situácie"><button aria-pressed="true">Pred AI</button><button aria-pressed="false">S AI</button></div>
      <div class="scene"><div class="lane"><h2>Majú nápad</h2><div class="faces" aria-hidden="true"></div></div><div class="lane"><h2>Realizujú ho</h2><div class="faces" aria-hidden="true"></div></div></div>
      <p id="caption" aria-live="polite"></p>
    </div></section>
    <section id="pribeh" class="chapter story"><div class="content"></div></section>
    <section id="detail" class="chapter detail"><div class="content"></div></section>
    <section id="zaver" class="chapter closing"><div class="content"></div></section>
  </main>
<script>
    const groups = document.querySelectorAll('.faces');
    const buttons = document.querySelectorAll('.switch button');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const people = Array.from({length:8}, (_, i) => {
      const face = document.createElement('div');
      face.className = 'person';
      face.style.backgroundPosition = (i % 4 * 100 / 3) + '% ' + Math.floor(i / 4) * 100 + '%';
      return face;
    });
    function show(after) {
      const starts = people.map(face => face.isConnected && face.getBoundingClientRect());
      people.forEach((face,i) => groups[Number(i >= (after ? 6 : 2))].append(face));
      people.forEach((face,i) => {
        face.getAnimations().forEach(animation => animation.cancel());
        if (!starts[i] || reduceMotion.matches) return;
        const end = face.getBoundingClientRect();
        const x = starts[i].left - end.left, y = starts[i].top - end.top;
        if (!x && !y) return;
        face.classList.add('moving');
        face.animate([{transform:'translate('+x+'px,'+y+'px)'},{transform:'none'}],
          {duration:650, easing:'ease-in-out'}).onfinish = () => face.classList.remove('moving');
      });
      buttons.forEach((button,i) => button.setAttribute('aria-pressed', String(Boolean(i) === after)));
      document.querySelector('#caption').textContent = after ? 'S AI má návrh takmer každý. Do realizácie sa v tomto príbehu pustia dvaja.' : 'Dvaja prišli s nápadom. Ďalší šiesti ho pomáhajú dostať do sveta.';
    }
    show(false);
    let timer;
    buttons.forEach((button,i) => button.onclick = () => { clearTimeout(timer); show(Boolean(i)); });
    if (!reduceMotion.matches) {
      const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
          timer = setTimeout(() => show(true), 3000);
          observer.disconnect();
        }
      });
      observer.observe(document.querySelector('.scene'));
    }
  </script>
</body>
